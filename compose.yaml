services:
  warp:
    image: ${WARP_IMAGE:?Set WARP_IMAGE to ghcr.io/owner/repository:latest}
    container_name: warp
    restart: unless-stopped
    # Isolated network namespace; never use host networking here.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:1080:1080/tcp"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    environment:
      WARP_AUTO_INIT: ${WARP_AUTO_INIT:-false}
      WARP_ACCEPT_TOS: ${WARP_ACCEPT_TOS:-false}
      WARP_PROXY_PORT: ${WARP_PROXY_PORT:-40000}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  warp-data:
