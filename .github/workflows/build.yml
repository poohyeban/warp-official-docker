name: Build and publish WARP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: warp-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Mask personal emails from event metadata
        shell: python
        run: |
          import json, os, re
          with open(os.environ["GITHUB_EVENT_PATH"]) as source:
              event = json.load(source)
          emails = set(re.findall(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", json.dumps(event)))
          for email in sorted(emails):
              print("::add-mask::" + email)
      - name: Remove image version with exposed event metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          owner, package = os.environ["GITHUB_REPOSITORY"].split("/")
          base = f"https://api.github.com/users/{owner}/packages/container/{package}/versions"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          affected = "sha256:2f5a52241c482b50632f837f0aba5d89c30fc1ada0b0965ebb0605c4cbb964db"
          page = 1
          while True:
              request = urllib.request.Request(f"{base}?per_page=100&page={page}", headers=headers)
              with urllib.request.urlopen(request) as response:
                  versions = json.load(response)
              for version in versions:
                  if version["name"] == affected:
                      request = urllib.request.Request(f"{base}/{version['id']}", headers=headers, method="DELETE")
                      with urllib.request.urlopen(request) as response:
                          print("Removed affected image version:", response.status)
              if len(versions) < 100:
                  break
              page += 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check script
        run: bash -n entrypoint.sh
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Use Buildx directly so action metadata cannot serialize the GitHub event.
      - name: Build local image
        run: docker buildx build --load --platform linux/amd64 --provenance=false --tag warp:check .
      - name: Check installed CLI (no registration)
        run: docker run --rm --network none warp:check warp-cli --help
      - name: Publish
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker buildx build --push --platform linux/amd64 \
            --provenance=mode=min \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:sha-$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
