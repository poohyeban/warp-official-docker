name: Reset container package
on:
  workflow_dispatch:
permissions:
  packages: write
jobs:
  reset:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete old container package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE users/poohyeban/packages/container/warp-official-docker
      - name: Verify anonymous access is blocked
        shell: python
        run: |
          import urllib.request, urllib.error
          url = "https://ghcr.io/token?service=ghcr.io&scope=repository:poohyeban/warp-official-docker:pull"
          try:
              urllib.request.urlopen(url, timeout=30)
          except urllib.error.HTTPError as error:
              print("Anonymous pull authorization after deletion:", error.code)
              assert error.code in (401, 403, 404)
          else:
              raise RuntimeError("Anonymous pull authorization is still available")
